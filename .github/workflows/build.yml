name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # 1. Создаём папку www и копируем туда файлы проекта
      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html css js www/ || true

      # 2. Инициализируем Capacitor, указывая папку www
      - name: Init Capacitor
        run: |
          npx cap init "KtoЧат" "com.kto.chat" --web-dir="www"

      # 3. Добавляем Android
      - name: Add Android
        run: npx cap add android

      # 4. Синхронизируем
      - name: Sync
        run: npx cap sync

      # 5. Собираем
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrunChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
