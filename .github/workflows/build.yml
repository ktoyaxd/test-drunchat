name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/assets

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # 1. Копируем файлы в www (включая assets для иконок)
      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html css js assets www/ || true

      # 2. Инициализируем Capacitor
      - name: Init Capacitor
        run: |
          npx cap init "DrunLite" "com.drun.lite" --web-dir="www"
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.drun.lite",
            "appName": "DrunLite",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#181818"
              }
            }
          }
          EOF

      # 3. Добавляем Android
      - name: Add Android
        run: npx cap add android

      # 4. Генерируем иконки
      - name: Generate Icons
        run: |
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "Иконка assets/icon.png не найдена, пропускаем."
          fi

      # 5. Устанавливаем версию 1.0 beta (2)
      - name: Set Version
        run: |
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0 beta (2)"/' android/app/build.gradle

      # 6. Добавляем разрешения на файловую систему
      - name: Add Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <application/' $MANIFEST

      # 7. Синхронизируем и собираем
      - name: Sync
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 8. Загружаем готовый APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrunLite-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
